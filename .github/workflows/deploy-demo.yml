# Publishes the src/demo app to GitHub Pages on every push to main (so: after a PR is
# merged, or after a direct push). One-time setup in the repo is required for this to
# work: Settings → Pages → Build and deployment → Source → "GitHub Actions".
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token permissions actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a queued run, but an in-flight deployment is never cancelled
# half-way — that could leave the published site in a torn state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # `cache: npm` is not enabled yet. It only became possible once
          # package-lock.json started being committed — see the install step below.

      # `min-release-age` in .npmrc is an npm >= 12 config key; the npm bundled with
      # Node 22 is 10.x and would silently ignore it, so the policy would not apply here.
      # The exact version is the one pinned in package.json's `packageManager` field —
      # keep the two in step, so CI and a Corepack-enabled checkout run the same npm.
      - run: npm install -g npm@12.0.1

      # Still `npm install` rather than `npm ci`, although package-lock.json is now
      # committed. The difference matters: `npm install` will quietly rewrite the
      # lockfile if package.json has drifted from it, so CI can build against
      # dependencies no one committed. `npm ci` fails loudly instead — switch when
      # the lockfile has proven itself here.
      - run: npm install

      # BASE_PATH is derived from the repo name rather than hardcoded, so a rename or a
      # fork publishes correctly without editing this file.
      - name: Build demo
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
